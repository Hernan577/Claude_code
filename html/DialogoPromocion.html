<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f7;
      padding: 20px;
      color: #1d1d1f;
    }

    .container {
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      max-width: 100%;
      overflow: hidden;
    }

    .content {
      padding: 20px 20px 16px;
    }

    .message {
      font-size: 15px;
      line-height: 1.5;
      color: #1d1d1f;
      text-align: center;
      margin-bottom: 12px;
      font-weight: 500;
    }

    .notice {
      background: #fff9e6;
      border-left: 3px solid #ffcc00;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .notice-text {
      font-size: 13px;
      line-height: 1.4;
      color: #1d1d1f;
    }

    .notice-text strong {
      color: #bf5000;
      font-weight: 600;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: #0071e3;
      color: white;
    }

    .btn-primary:hover {
      background: #0077ed;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
    }

    .btn-secondary {
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .btn-secondary:hover {
      background: #e8e8ed;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    @media (max-width: 400px) {
      .content {
        padding: 24px 16px 16px;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .btn {
        padding: 12px;
        font-size: 14px;
      }

      .notice-text {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <div class="message">¿Corresponde a una promoción de Honda?</div>

      <div class="notice">
        <div class="notice-text">
          <strong>Importante:</strong> El cliente debe contratar Honda Plus para obtener matrícula gratis
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" onclick="setValorYCerrar('Matricula Gratis HP / Reclamo (130€)')">
          Sí
        </button>
        <button class="btn btn-secondary" onclick="setValorYCerrar('Matricula Regalo Maquina')">
          No
        </button>
      </div>
    </div>
  </div>

  <script>
    function setValorYCerrar(concepto) {
      google.script.run
        .withSuccessHandler(function() { google.script.host.close(); })
        .withFailureHandler(function(error) {
          alert("Error: " + error.message);
          google.script.host.close();
        })
        .setValorCeldaPromo(concepto);
    }
  </script>
</body>
</html>
