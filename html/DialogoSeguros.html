<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', 'Google Sans', Arial, sans-serif;
      background: white;
      padding: 24px;
      color: #202124;
    }

    .message {
      font-size: 16px;
      line-height: 1.5;
      color: #202124;
      margin-bottom: 20px;
      font-weight: 400;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background: white;
      border: 1px solid #dadce0;
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      color: #202124;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      font-family: 'Roboto', Arial, sans-serif;
    }

    .option-btn:hover {
      background: #f8f9fa;
      border-color: #1a73e8;
    }

    .option-btn:active {
      background: #e8f0fe;
    }

    @media (max-width: 400px) {
      body {
        padding: 16px;
      }

      .option-btn {
        padding: 14px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="message">Selecciona el tipo de seguro</div>

  <div class="options">
    <button class="option-btn" onclick="setValorYCerrar('TERCEROS')">
      Terceros
    </button>
    <button class="option-btn" onclick="setValorYCerrar('AMPLIADO')">
      Ampliado
    </button>
    <button class="option-btn" onclick="setValorYCerrar('T. RIESGO')">
      Todo Riesgo
    </button>
  </div>

  <script>
    function setValorYCerrar(valor) {
      google.script.run
        .withSuccessHandler(function() { google.script.host.close(); })
        .withFailureHandler(function(error) {
          alert("Error: " + error.message);
          google.script.host.close();
        })
        .setValorCelda(valor);
    }
  </script>
</body>
</html>
