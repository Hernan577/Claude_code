<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Calibri', sans-serif;
      text-align: center;
    }
    .button-container {
      display: flex;
      padding: 15px;
    }
    .button {
      padding: 10px 20px;
      margin: 4px;
      font-size: 14px;
      cursor: pointer;
      color: #fff;
      border: 1px solid transparent;
      border-radius: 4px;
      background-color: #4CAF50;
      transition: opacity 0.2s, background-color 0.2s;
    }
    .button:hover {
      background-color: #3e8e41;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="button-container">
    <button class="button" onclick="setValorYCerrar('TERCEROS')">TERCEROS</button>
    <button class="button" onclick="setValorYCerrar('AMPLIADO')">AMPLIADO</button>
    <button class="button" onclick="setValorYCerrar('T. RIESGO')">T. RIESGO</button>
  </div>
  <script>
    function setValorYCerrar(valor) {
      google.script.run
        .withSuccessHandler(function() { google.script.host.close(); })
        .withFailureHandler(function(error) {
          alert("Error: " + error.message);
          google.script.host.close();
        })
        .setValorCelda(valor);
    }
  </script>
</body>
</html>
