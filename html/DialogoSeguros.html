<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f7;
      padding: 20px;
      color: #1d1d1f;
    }

    .container {
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      max-width: 100%;
      overflow: hidden;
    }

    .content {
      padding: 32px 24px 24px;
    }

    .message {
      font-size: 15px;
      line-height: 1.6;
      color: #86868b;
      text-align: center;
      margin-bottom: 24px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .option-btn {
      background: #f5f5f7;
      border: 2px solid transparent;
      padding: 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      color: #1d1d1f;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .option-btn:hover {
      background: #e8e8ed;
      border-color: #0071e3;
      transform: translateY(-1px);
    }

    .option-btn:active {
      transform: translateY(0);
    }

    @media (max-width: 400px) {
      .content {
        padding: 24px 16px 16px;
      }

      .option-btn {
        padding: 14px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <div class="message">Selecciona el tipo de seguro</div>

      <div class="options">
        <button class="option-btn" onclick="setValorYCerrar('TERCEROS')">
          Terceros
        </button>
        <button class="option-btn" onclick="setValorYCerrar('AMPLIADO')">
          Ampliado
        </button>
        <button class="option-btn" onclick="setValorYCerrar('T. RIESGO')">
          Todo Riesgo
        </button>
      </div>
    </div>
  </div>

  <script>
    function setValorYCerrar(valor) {
      google.script.run
        .withSuccessHandler(function() { google.script.host.close(); })
        .withFailureHandler(function(error) {
          alert("Error: " + error.message);
          google.script.host.close();
        })
        .setValorCelda(valor);
    }
  </script>
</body>
</html>
