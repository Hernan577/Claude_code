<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f7;
      padding: 20px;
      color: #1d1d1f;
    }

    .container {
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      max-width: 100%;
      overflow: hidden;
    }

    .header {
      text-align: center;
      padding: 20px 20px 12px;
      border-bottom: 1px solid #d2d2d7;
    }

    .success-icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .header-title {
      font-size: 16px;
      font-weight: 600;
      color: #1d1d1f;
      margin-bottom: 6px;
    }

    .header-subtitle {
      font-size: 13px;
      color: #86868b;
    }

    .content {
      padding: 20px;
    }

    .pdf-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .pdf-item {
      background: #f5f5f7;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .pdf-item:hover {
      background: #e8e8ed;
      border-color: #0071e3;
      transform: translateY(-1px);
    }

    .pdf-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .pdf-icon {
      font-size: 22px;
      flex-shrink: 0;
    }

    .pdf-details {
      flex: 1;
      min-width: 0;
    }

    .pdf-name {
      font-size: 14px;
      font-weight: 500;
      color: #1d1d1f;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pdf-type {
      font-size: 12px;
      color: #86868b;
      margin-top: 2px;
    }

    .download-icon {
      flex-shrink: 0;
      color: #0071e3;
      font-size: 18px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 20px 16px;
    }

    .btn {
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: #0071e3;
      color: white;
    }

    .btn-primary:hover {
      background: #0077ed;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
    }

    .btn-secondary {
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .btn-secondary:hover {
      background: #e8e8ed;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    @media (max-width: 500px) {
      body {
        padding: 12px;
      }

      .header {
        padding: 24px 16px 12px;
      }

      .content {
        padding: 16px;
      }

      .actions {
        padding: 0 16px 16px;
        grid-template-columns: 1fr;
      }

      .pdf-item {
        padding: 12px;
      }

      .pdf-name {
        font-size: 14px;
      }

      .pdf-type {
        font-size: 11px;
      }

      .btn {
        padding: 12px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="success-icon">✅</div>
      <div class="header-title">PDFs generados correctamente</div>
      <div class="header-subtitle">Haz clic en cada archivo para descargarlo</div>
    </div>

    <div class="content">
      <div class="pdf-list" id="pdfList"></div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="descargarTodos()">
        ⬇️ Descargar todos
      </button>
      <button class="btn btn-secondary" onclick="cerrar()">
        Cerrar
      </button>
    </div>
  </div>

  <script>
    var pdfs = <?= JSON.stringify(pdfs) ?>;
    var clienteInfo = <?= JSON.stringify(clienteInfo) ?>;

    function renderPDFs() {
      var container = document.getElementById('pdfList');
      container.innerHTML = '';

      pdfs.forEach(function(pdf) {
        var item = document.createElement('div');
        item.className = 'pdf-item';
        item.onclick = function() { window.open(pdf.url, '_blank'); };

        var icon = getIcon(pdf.tipo);
        var tipo = getTipo(pdf.tipo);

        item.innerHTML =
          '<div class="pdf-info">' +
            '<div class="pdf-icon">' + icon + '</div>' +
            '<div class="pdf-details">' +
              '<div class="pdf-name">' + pdf.nombre + '</div>' +
              '<div class="pdf-type">' + tipo + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="download-icon">↓</div>';

        container.appendChild(item);
      });
    }

    function getIcon(tipo) {
      switch(tipo) {
        case 'caratula': return '📋';
        case 'factura': return '💰';
        case 'instrucciones': return '📝';
        default: return '📄';
      }
    }

    function getTipo(tipo) {
      switch(tipo) {
        case 'caratula': return 'Carátula del cliente';
        case 'factura': return 'Factura de la moto';
        case 'instrucciones': return 'Instrucciones para facturación';
        default: return 'Documento';
      }
    }

    function descargarTodos() {
      pdfs.forEach(function(pdf, index) {
        setTimeout(function() {
          window.open(pdf.url, '_blank');
        }, index * 400);
      });
    }

    function cerrar() {
      google.script.host.close();
    }

    renderPDFs();
  </script>
</body>
</html>
