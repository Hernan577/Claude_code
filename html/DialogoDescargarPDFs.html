<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f7;
      padding: 20px;
      color: #1d1d1f;
    }

    .container {
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      max-width: 100%;
      overflow: hidden;
    }

    .header {
      text-align: center;
      padding: 20px 20px 12px;
      border-bottom: 1px solid #d2d2d7;
    }

    .success-icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .header-title {
      font-size: 16px;
      font-weight: 600;
      color: #1d1d1f;
      margin-bottom: 6px;
    }

    .header-subtitle {
      font-size: 13px;
      color: #86868b;
    }

    .content {
      padding: 20px;
    }

    .pdf-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .pdf-item {
      background: #f5f5f7;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .pdf-item:hover {
      background: #e8e8ed;
      border-color: #0071e3;
      transform: translateY(-1px);
    }

    .pdf-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .pdf-icon {
      font-size: 22px;
      flex-shrink: 0;
    }

    .pdf-details {
      flex: 1;
      min-width: 0;
    }

    .pdf-name {
      font-size: 14px;
      font-weight: 500;
      color: #1d1d1f;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pdf-type {
      font-size: 12px;
      color: #86868b;
      margin-top: 2px;
    }

    .download-icon {
      flex-shrink: 0;
      color: #0071e3;
      font-size: 18px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 20px 16px;
    }

    .btn {
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: #0071e3;
      color: white;
    }

    .btn-primary:hover {
      background: #0077ed;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
    }

    .btn-secondary {
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .btn-secondary:hover {
      background: #e8e8ed;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    @media (max-width: 500px) {
      body {
        padding: 12px;
      }

      .header {
        padding: 24px 16px 12px;
      }

      .content {
        padding: 16px;
      }

      .actions {
        padding: 0 16px 16px;
        grid-template-columns: 1fr;
      }

      .pdf-item {
        padding: 12px;
      }

      .pdf-name {
        font-size: 14px;
      }

      .pdf-type {
        font-size: 11px;
      }

      .btn {
        padding: 12px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="success-icon">✅</div>
      <div class="header-title">PDFs generados correctamente</div>
      <div class="header-subtitle">Haz clic en cada archivo para descargarlo</div>
    </div>

    <div class="content">
      <div class="pdf-list" id="pdfList"></div>
    </div>

    <div class="actions">
      <button id="btnDescargarTodos" class="btn btn-primary" onclick="descargarTodos(event)">
        ⬇️ Descargar todos
      </button>
      <button class="btn btn-secondary" onclick="cerrar()">
        Cerrar
      </button>
    </div>
  </div>

  <script>
    // Recibir datos del servidor con validación
    var pdfs = <?!= JSON.stringify(pdfs) ?>;
    var clienteInfo = <?!= JSON.stringify(clienteInfo) ?>;

    // Debug: Mostrar lo que se recibió
    console.log('PDFs recibidos:', pdfs);
    console.log('Cliente info:', clienteInfo);
    console.log('pdfs es array?', Array.isArray(pdfs));

    // Validar que pdfs sea un array
    if (!Array.isArray(pdfs)) {
      console.error('ERROR: pdfs no es un array:', pdfs);
      alert('Error: No se recibieron correctamente los datos de los PDFs.\n\nTipo recibido: ' + typeof pdfs);
      pdfs = [];
    }

    function renderPDFs() {
      var container = document.getElementById('pdfList');
      container.innerHTML = '';

      if (!pdfs || pdfs.length === 0) {
        container.innerHTML = '<div style="text-align:center;color:#86868b;padding:20px;">No hay PDFs disponibles</div>';
        return;
      }

      pdfs.forEach(function(pdf) {
        var item = document.createElement('div');
        item.className = 'pdf-item';
        item.onclick = function() { descargarPDF(pdf.url, pdf.nombre); };

        var icon = getIcon(pdf.tipo);
        var tipo = getTipo(pdf.tipo);

        item.innerHTML =
          '<div class="pdf-info">' +
            '<div class="pdf-icon">' + icon + '</div>' +
            '<div class="pdf-details">' +
              '<div class="pdf-name">' + pdf.nombre + '</div>' +
              '<div class="pdf-type">' + tipo + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="download-icon">↓</div>';

        container.appendChild(item);
      });
    }

    function getIcon(tipo) {
      switch(tipo) {
        case 'caratula': return '📋';
        case 'factura': return '💰';
        case 'instrucciones': return '📝';
        default: return '📄';
      }
    }

    function getTipo(tipo) {
      switch(tipo) {
        case 'caratula': return 'Carátula del cliente';
        case 'factura': return 'Factura de la moto';
        case 'instrucciones': return 'Instrucciones para facturación';
        default: return 'Documento';
      }
    }

    function convertirAUrlDescarga(url) {
      // Convertir URL de Google Drive a formato de descarga directa
      // De: https://drive.google.com/file/d/FILE_ID/view
      // A: https://drive.google.com/uc?export=download&id=FILE_ID
      var match = url.match(/\/d\/([^\/]+)/);
      if (match && match[1]) {
        return 'https://drive.google.com/uc?export=download&id=' + match[1];
      }
      return url;
    }

    function descargarPDF(url, nombre) {
      var urlDescarga = convertirAUrlDescarga(url);
      var a = document.createElement('a');
      a.href = urlDescarga;
      a.download = nombre + '.pdf';
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function descargarTodos(evt) {
      var btn = evt ? evt.target : document.getElementById('btnDescargarTodos');
      var textoOriginal = btn.innerHTML;

      // Validar que pdfs existe y es un array
      if (!pdfs || !Array.isArray(pdfs) || pdfs.length === 0) {
        alert('No hay PDFs disponibles para descargar');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '⏳ Descargando...';

      try {
        // Descargar todos los PDFs directamente a la carpeta de Descargas
        var descargados = 0;
        for (var i = 0; i < pdfs.length; i++) {
          var pdf = pdfs[i];
          if (pdf && pdf.url) {
            // Pequeño delay para evitar que el navegador bloquee las descargas múltiples
            (function(p, index) {
              setTimeout(function() {
                descargarPDF(p.url, p.nombre);
              }, index * 300);
            })(pdf, i);
            descargados++;
          }
        }

        // Feedback al usuario
        setTimeout(function() {
          btn.innerHTML = '✅ Descargados (' + descargados + ')';
          btn.disabled = false;
        }, pdfs.length * 300 + 500);
      } catch(e) {
        btn.innerHTML = textoOriginal;
        btn.disabled = false;
        alert('Error al descargar PDFs: ' + e.message);
      }
    }

    function cerrar() {
      google.script.host.close();
    }

    renderPDFs();
  </script>
</body>
</html>
