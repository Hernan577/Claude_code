<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', 'Google Sans', Arial, sans-serif;
      background: white;
      padding: 24px;
      color: #202124;
    }

    .message {
      font-size: 16px;
      line-height: 1.5;
      color: #202124;
      margin-bottom: 16px;
      font-weight: 400;
    }

    .info {
      background: #f1f3f4;
      padding: 12px 16px;
      border-radius: 4px;
      margin-bottom: 20px;
    }

    .info-text {
      font-size: 14px;
      line-height: 1.4;
      color: #5f6368;
    }

    .info-text strong {
      color: #202124;
      font-weight: 500;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: flex-start;
    }

    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      font-family: 'Roboto', Arial, sans-serif;
    }

    .btn-primary {
      background: #1a73e8;
      color: white;
    }

    .btn-primary:hover {
      background: #1557b0;
    }

    .btn-secondary {
      background: white;
      color: #5f6368;
      border: 1px solid #dadce0;
    }

    .btn-secondary:hover {
      background: #f8f9fa;
      border-color: #bdc1c6;
    }

    .btn:active {
      opacity: 0.8;
    }

    @media (max-width: 400px) {
      body {
        padding: 16px;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="message">¿Cliente adhiere al Plan Reinicia Auto+?</div>

  <div class="info">
    <div class="info-text">
      Selecciona <strong>Sí</strong> para aplicar el descuento Plan REINICIA AUTO+
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" onclick="respuestaPlanReinicia(true)">
      Sí
    </button>
    <button class="btn btn-secondary" onclick="respuestaPlanReinicia(false)">
      No
    </button>
  </div>

  <script>
    function respuestaPlanReinicia(adhesion) {
      google.script.run
        .withSuccessHandler(function() { google.script.host.close(); })
        .respuestaReiniciaPlan(adhesion);
    }
  </script>
</body>
</html>
